[package]
name = "gitpeek"
version = "0.1.1"
description = "個人用 Git ビューワー"
authors = ["tatsunoko"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# `rc` は Arc<RepositorySnapshot> をそのまま返すため（巨大リポジトリでの複製を避ける）。
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
# ref 集合の指紋（キャッシュ無効化）に使う。
sha2 = "0.10"
# 文字コード判別（docs/DESIGN.md §9.1）。Shift_JIS は Windows-31J として扱われる。
encoding_rs = "0.8"
# API キーの保管先（Windows 資格情報マネージャー。CLAUDE.md §4）。
# 既定機能の `v1` だけで足り、プラットフォーム別のストアは target で絞られる。
# `CredWriteW` を直に叩くとこのプロジェクト初の unsafe が要るので、依存 1 つと引き換えにしている。
keyring = "4"
# LLM への HTTP。**ブロッキング**であることが要件（このコードベースは spawn_blocking で揃えてある）。
ureq = "3"
# skill の `globs` 照合（T-21）。自前で書くと `**` と `*` の境目で必ず間違える。
# 増える木は `bstr` 1 つだけ（残りは `regex` 経由で既にある）。
globset = "0.4"
# ログファイル（T-24。DESIGN.md §13.3.1）。**利用者の判断で足した**（自前で書く案と
# 並べて聞いた結果）。回転と書き出しを持つが、**置き場所・書式・掃除はこちらで決める** —
# 既定の LogDir は Windows では %LOCALAPPDATA% を指すため使わない。
tauri-plugin-log = "2.9.1"
# `log` のマクロ（`log::info!`）を使うために直接依存にする。実体は上のプラグイン。
log = "0.4.34"

[dev-dependencies]
tempfile = "3"
